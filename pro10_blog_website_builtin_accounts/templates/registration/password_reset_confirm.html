{% extends "base.html" %}
{% block content %}
    {% if validlink %}
        <h2>Set a new password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change password</button>
        </form>
    {% else %}
        <h2>Invalid or expired link</h2>
        <p>This password reset link is no longer valid. It may have already been used, or it has expired.</p>
        <a href="{% url 'password_reset' %}">Request a new one</a>
    {% endif %}
{% endblock %}
