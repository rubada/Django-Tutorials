{% extends "base.html" %}

{% block title %}Delete {{ blog.title }} - My Blog{% endblock title %}

{% block content %}
    <h1>Delete "{{ blog.title }}"</h1>
    <p>Are you sure you want to delete this blog? This action cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
        <a href="{{ blog.get_absolute_url }}">Cancel</a>
    </form>
{% endblock content %}
