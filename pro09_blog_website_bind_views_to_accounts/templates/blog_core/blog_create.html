{% extends "base.html" %}

{% block title %}Create Blog - My Blog{% endblock title %}

{% block content %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Blog</button>
        <a href="{% url 'blogs_user_list' %}">Cancel</a>
    </form>
{% endblock content %}
