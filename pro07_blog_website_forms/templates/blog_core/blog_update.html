{% extends "base.html" %}

{% block title %}Update {{ blog.title }} - My Blog{% endblock title %}

{% block content %}
    <h1>Update "{{ blog.title }}"</h1>
    <form method="POST">
        {% csrf_token %}
        <!-- {{ form.as_p }} is a Django template tag that automatically renders all
        form fields wrapped in <p> tags. -->
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
        <a href="{{ blog.get_absolute_url }}">Cancel</a>
    </form>
{% endblock content %}
