{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog Website{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Header Navigation -->
    <header>
        <nav>
            <div class="logo">My Blog</div>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <!-- Here change the the blog_data to blogs_list -->
                <li><a href="{% url 'blogs_list' %}">Blogs</a></li>
                <li><a href="{% url 'admin:index' %}" class="admin-link">Admin</a></li>
                <!-- To ADD the admin link you can use the admin name or use the admin url -->
                 <!-- <li><a href="/admin/">Admin</a></li> -->
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}
        <!-- Child templates will replace this block -->
        {% endblock content %}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Blog Website. All rights reserved.</p>
        <div class="footer-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="/admin/">Admin</a>
            <a href="#">Contact</a>
        </div>
    </footer>

</body>
</html>
